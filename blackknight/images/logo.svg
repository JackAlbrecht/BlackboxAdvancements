<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" aria-label="Black Knight Auto Body & Painting logo">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5D77A"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9F7E1E"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="sheen" cx="50%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer shield, gold ring -->
  <path d="M120 8 L218 38 L218 122 Q218 192 120 232 Q22 192 22 122 L22 38 Z"
        fill="url(#goldGrad)"/>
  <!-- Inner shield, dark fill -->
  <path d="M120 20 L206 46 L206 120 Q206 182 120 218 Q34 182 34 120 L34 46 Z"
        fill="url(#darkGrad)"/>
  <!-- Sheen -->
  <path d="M120 20 L206 46 L206 120 Q206 182 120 218 Q34 182 34 120 L34 46 Z"
        fill="url(#sheen)"/>

  <!-- Knight helm silhouette (simplified jousting helm) -->
  <g fill="url(#goldGrad)" transform="translate(120 110)">
    <!-- skull cap -->
    <path d="M-34 -38 Q-34 -52 -22 -56 L22 -56 Q34 -52 34 -38 L34 -10 L-34 -10 Z"/>
    <!-- visor band -->
    <rect x="-36" y="-12" width="72" height="6" rx="2"/>
    <!-- visor slits -->
    <rect x="-26" y="-3" width="14" height="4" fill="#0A0A0A"/>
    <rect x="-6"  y="-3" width="12" height="4" fill="#0A0A0A"/>
    <rect x="12"  y="-3" width="14" height="4" fill="#0A0A0A"/>
    <!-- gorget / chin -->
    <path d="M-34 4 Q-34 22 -22 26 L22 26 Q34 22 34 4 L26 4 L22 14 L-22 14 L-26 4 Z"/>
    <!-- plume crest -->
    <path d="M-2 -56 L0 -76 L8 -68 L16 -78 L18 -64 L26 -70 L24 -56 Z" opacity="0.85"/>
  </g>

  <!-- Crossed paint sprayer nozzles below helm -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
    <line x1="60"  y1="160" x2="120" y2="148"/>
    <line x1="180" y1="160" x2="120" y2="148"/>
  </g>
  <circle cx="120" cy="148" r="4" fill="url(#goldGrad)"/>

  <!-- Monogram BK on lower banner -->
  <text x="120" y="190" text-anchor="middle"
        font-family="'Fraunces','Playfair Display',Georgia,serif"
        font-weight="900" font-size="30" fill="url(#goldGrad)" letter-spacing="2">BLACK KNIGHT</text>
  <text x="120" y="208" text-anchor="middle"
        font-family="'JetBrains Mono','Courier New',monospace"
        font-size="7" fill="#F5EFE0" letter-spacing="3" font-weight="700">AUTO PAINT · SURREY BC</text>
</svg>
